    <!-- Link previews (messages, Slack, LinkedIn, X).
         og:url and og:image must be absolute — relative paths are ignored, so
         these carry the domain rather than a leading slash. og-image.png is not
         in public/ yet; until it is, previews show the text without a picture. -->
    <meta property="og:site_name" content="Sterling Crypto Bank" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sterling Crypto Bank" />
    <meta
      property="og:description"
      content="A demo crypto banking app: portfolio tracking, live-price trading, deposits and identity verification. A portfolio project, not a real bank."
    />
    <meta property="og:url" content="https://sterlingbank.org" />
    <meta property="og:image" content="https://sterlingbank.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Sterling Crypto Bank dashboard, showing a portfolio balance and market prices." />
